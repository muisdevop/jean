name: Verify Self Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './jean-core -> target'
          shared-key: verify-self-update

      - name: CLI update tests
        run: cargo test --manifest-path jean-core/Cargo.toml cli_update::tests -- --nocapture
